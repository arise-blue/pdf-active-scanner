version: '3.8'

services:
  app:
    build: .
    image: india-tracker:latest
    container_name: india-tracker-app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO

  nginx:
    image: nginx:alpine
    container_name: india-tracker-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  data:
